services:
  postgres:
    image: postgres:17-alpine
    container_name: lorrylogix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lorrylogix
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: LorryLogiX@2026
    ports: ["5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d lorrylogix"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
